<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PawPals Pet Clinic — caring for your pets, online and offline." />
  <meta name="theme-color" content="#2e7d6b" />
  <title>PawPals Pet Clinic</title>
  <link rel="shortcut icon" href="/pawpals-logo.svg" type="image/svg+xml">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('pawpals-theme');
        var theme =
          saved ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>

  <script type="module" crossorigin src="/assets/index-RsHVQ4Tz.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-AuwPaDLq.css">
<link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>

<body>
  <header class="site-header">
    <a href="/" class="logo" data-link aria-label="PawPals home">
      <img src="/pawpals-logo.svg" alt="" width="40" height="40" />
      <span>PawPals</span>
    </a>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="/" data-link>Home</a></li>
        <li><a href="/services" data-link>Services</a></li>
        <li><a href="/appointment" data-link>Book Appointment</a></li>
        <li><a href="/products" data-link>Products</a></li>
      </ul>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode"
      aria-pressed="false">🌙</button>
    <button id="install-btn" class="install-btn" type="button" hidden>
      Install App
    </button>
  </header>

  <main id="app"></main>

  <footer>
    <p>&copy; 2026 PawPals Pet Clinic</p>
  </footer>

  <script>
    (function () {
      var redirect = sessionStorage.getItem('redirect');
      sessionStorage.removeItem('redirect');
      if (redirect && redirect !== location.href) {
        var path = new URL(redirect).pathname;
        history.replaceState(null, '', path);
        window.dispatchEvent(new PopStateEvent('popstate'));
      }
    })();
  </script>

</body>

</html>
